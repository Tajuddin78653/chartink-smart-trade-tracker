version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cstt_postgres
    restart: always
    environment:
      POSTGRES_DB: chartink_tracker
      POSTGRES_USER: cstt_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - cstt_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cstt_user -d chartink_tracker"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options: { max-size: "10m", max-file: "3" }

  redis:
    image: redis:7-alpine
    container_name: cstt_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - cstt_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  n8n:
    image: n8nio/n8n:latest
    container_name: cstt_n8n
    restart: always
    environment:
      - N8N_HOST=${DOMAIN:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL:-https}
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD}
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=chartink_tracker
      - DB_POSTGRESDB_USER=cstt_user
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      - WEBHOOK_URL=https://${DOMAIN:-localhost}/n8n
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - cstt_network
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cstt_backend
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=postgresql://cstt_user:${POSTGRES_PASSWORD}@postgres:5432/chartink_tracker
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - FRONTEND_URL=https://${DOMAIN:-localhost}
      - BROKER=${BROKER:-dhan}
      - DHAN_ACCESS_TOKEN=${DHAN_ACCESS_TOKEN}
      - DHAN_CLIENT_ID=${DHAN_CLIENT_ID}
      - UPSTOX_ACCESS_TOKEN=${UPSTOX_ACCESS_TOKEN}
      - ZERODHA_ACCESS_TOKEN=${ZERODHA_ACCESS_TOKEN}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
    volumes:
      - ./backend/logs:/app/logs
    networks:
      - cstt_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=https://${DOMAIN:-localhost}/api
        - NEXT_PUBLIC_WS_URL=wss://${DOMAIN:-localhost}
    container_name: cstt_frontend
    restart: always
    networks:
      - cstt_network
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: cstt_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - certbot_data:/var/www/certbot:ro
    networks:
      - cstt_network
    depends_on:
      - frontend
      - backend
      - n8n

volumes:
  postgres_data:
  redis_data:
  n8n_data:
  certbot_data:

networks:
  cstt_network:
    driver: bridge
