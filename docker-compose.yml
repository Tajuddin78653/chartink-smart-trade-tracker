version: '3.8'

services:
  # ── PostgreSQL Database ────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: cstt_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: chartink_tracker
      POSTGRES_USER: cstt_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cstt_secure_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - cstt_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cstt_user -d chartink_tracker"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis Cache ────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: cstt_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-cstt_redis_pass}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - cstt_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── N8N Workflow Engine ────────────────────────────────
  n8n:
    image: n8nio/n8n:latest
    container_name: cstt_n8n
    restart: unless-stopped
    environment:
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:-n8n_secure_pass}
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=chartink_tracker
      - DB_POSTGRESDB_USER=cstt_user
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:-cstt_secure_pass}
      - WEBHOOK_URL=${N8N_WEBHOOK_URL:-http://localhost:5678}
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/home/node/.n8n/workflows
    networks:
      - cstt_network
    depends_on:
      postgres:
        condition: service_healthy

  # ── Backend API (Node.js + Express) ───────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cstt_backend
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=4000
      - DATABASE_URL=postgresql://cstt_user:${POSTGRES_PASSWORD:-cstt_secure_pass}@postgres:5432/chartink_tracker
      - REDIS_URL=redis://:${REDIS_PASSWORD:-cstt_redis_pass}@redis:6379
      - JWT_SECRET=${JWT_SECRET:-your_jwt_secret_here}
      - N8N_WEBHOOK_BASE=${N8N_WEBHOOK_URL:-http://n8n:5678}
    ports:
      - "4000:4000"
    networks:
      - cstt_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Frontend (Next.js 15) ──────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cstt_frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=${API_URL:-http://localhost:4000}
      - NEXT_PUBLIC_WS_URL=${WS_URL:-ws://localhost:4000}
    ports:
      - "3000:3000"
    networks:
      - cstt_network
    depends_on:
      - backend

  # ── Nginx Reverse Proxy ────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: cstt_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    networks:
      - cstt_network
    depends_on:
      - frontend
      - backend
      - n8n

volumes:
  postgres_data:
  redis_data:
  n8n_data:

networks:
  cstt_network:
    driver: bridge
