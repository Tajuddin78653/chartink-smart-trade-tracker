events { worker_connections 2048; }

http {
    # ── Upstreams ──────────────────────────────────────────
    upstream backend  { server backend:4000;  keepalive 32; }
    upstream frontend { server frontend:3000; keepalive 32; }
    upstream n8n      { server n8n:5678;      keepalive 16; }

    # ── Rate Limiting ──────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api:10m     rate=60r/m;
    limit_req_zone $binary_remote_addr zone=webhook:10m rate=120r/m;
    limit_req_zone $binary_remote_addr zone=auth:10m    rate=10r/m;

    # ── Gzip ───────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
    gzip_min_length 1000;

    # ── HTTP → HTTPS redirect ──────────────────────────────
    server {
        listen 80;
        server_name _;
        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { return 301 https://$host$request_uri; }
    }

    # ── HTTPS Main Server ──────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name _;

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;

        # Security headers
        add_header X-Frame-Options           SAMEORIGIN;
        add_header X-XSS-Protection          "1; mode=block";
        add_header X-Content-Type-Options    nosniff;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains";
        add_header Referrer-Policy           strict-origin-when-cross-origin;

        # ── Frontend ──────────────────────────────────────
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host       $host;
            proxy_cache_bypass          $http_upgrade;
        }

        # ── Auth endpoints (strict rate limit) ────────────
        location /api/auth/ {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass         http://backend;
            proxy_set_header   Host            $host;
            proxy_set_header   X-Real-IP       $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── Webhook (relaxed rate limit) ──────────────────
        location /api/webhook/ {
            limit_req zone=webhook burst=30 nodelay;
            proxy_pass         http://backend;
            proxy_set_header   Host            $host;
            proxy_set_header   X-Real-IP       $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── General API ───────────────────────────────────
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host            $host;
            proxy_set_header   X-Real-IP       $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── WebSocket (Socket.IO) ─────────────────────────
        location /socket.io/ {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
            proxy_read_timeout 86400;
        }

        # ── N8N ───────────────────────────────────────────
        location /n8n/ {
            proxy_pass         http://n8n/;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection 'upgrade';
            proxy_set_header   Host       $host;
        }

        # ── Health check ──────────────────────────────────
        location /health {
            proxy_pass http://backend/api/health;
        }
    }
}
