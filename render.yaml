# ============================================================
# Chartink Smart Trade Tracker — Render.com IaC
# Deploy everything with one click from GitHub
# Note: Redis via Upstash (free external) — set REDIS_URL manually
# ============================================================

databases:
  # ── PostgreSQL (app data) ──────────────────────────────
  - name: chartink-postgres
    databaseName: chartink_tracker
    user: cstt_user
    plan: free
    region: singapore

services:
  # ── Backend API (Node.js + Express) ────────────────────
  - type: web
    name: chartink-backend
    region: singapore
    plan: free
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: chartink-postgres
          property: connectionString
      - key: REDIS_URL
        sync: false   # Set this manually: get free Redis from https://upstash.com
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        fromService:
          name: chartink-frontend
          type: web
          property: host
      - key: BROKER
        value: dhan
      - key: DHAN_ACCESS_TOKEN
        sync: false
      - key: DHAN_CLIENT_ID
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: UPSTOX_ACCESS_TOKEN
        sync: false
      - key: ZERODHA_ACCESS_TOKEN
        sync: false
      - key: BACKEND_URL
        value: https://chartink-backend.onrender.com/api/health
      - key: FRONTEND_URL
        value: https://chartink-frontend.onrender.com
      - key: N8N_URL
        value: https://chartink-n8n.onrender.com/healthz

  # ── Frontend (Next.js 15) ───────────────────────────────
  - type: web
    name: chartink-frontend
    region: singapore
    plan: free
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: chartink-backend
          type: web
          property: host
      - key: NEXT_PUBLIC_WS_URL
        fromService:
          name: chartink-backend
          type: web
          property: host

  # ── N8N Workflow Engine ─────────────────────────────────
  - type: web
    name: chartink-n8n
    region: singapore
    plan: free
    runtime: image
    image:
      url: docker.io/n8nio/n8n:latest
    envVars:
      - key: N8N_HOST
        value: 0.0.0.0
      - key: N8N_PORT
        value: 10000
      - key: N8N_SKIP_WEBHOOK_DEREGISTRATION_SHUTDOWN
        value: "true"
      - key: N8N_PROTOCOL
        value: https
      - key: N8N_BASIC_AUTH_ACTIVE
        value: "true"
      - key: N8N_USER
        value: admin
      - key: N8N_PASSWORD
        generateValue: true
      - key: DB_TYPE
        value: sqlite
      - key: DB_SQLITE_DATABASE
        value: /home/node/.n8n/database.sqlite
      - key: N8N_ENCRYPTION_KEY
        generateValue: true
      - key: WEBHOOK_URL
        fromService:
          name: chartink-n8n
          type: web
          property: host
